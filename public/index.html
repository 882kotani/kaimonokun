<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家族の買い物メモ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>買い物メモ</h1>
      <span class="sync-status" id="syncStatus">同期中</span>
    </div>
    <p class="lead">家族でリアルタイムに共有できるお買い物リスト</p>

    <div class="template-actions">
      <button class="ghost-btn" id="openTemplateBtn">テンプレートを編集</button>
      <button class="ghost-btn" id="copyTemplateBtn">テンプレートから追加</button>
    </div>

    <!-- 買い物リスト追加バー -->
    <form class="add-bar" id="addForm">
      <input type="text" id="addInput" placeholder="買うものを入力" autocomplete="off" />
      <button type="submit">+</button>
    </form>

    <!-- 買い物リスト本体 -->
    <div class="column">
      <div class="column-head">
        <span>買い物リスト</span>
        <span class="count" id="listCount">0件</span>
      </div>
      <p class="empty" id="listEmpty">リストは空です</p>
      <div class="items" id="listItems"></div>
    </div>

    <!-- アクションボタン -->
    <div class="list-actions">
      <button class="clear-btn" id="clearCartBtn" hidden>カゴに入れたものを削除</button>
      <button class="clear-btn danger" id="clearAllBtn" hidden>すべて削除</button>
    </div>
  </div>

  <!-- テンプレート編集モーダル -->
  <div class="modal-overlay" id="templateModal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h2>テンプレートの編集</h2>
        <button class="close-modal-btn" id="closeTemplateBtn">×</button>
      </div>
      <p class="hint">よく買うものを登録しておくと、ワンタップでリストに追加できます。</p>

      <div class="items" id="templateItems"></div>

      <form class="add-bar small" id="templateAddForm">
        <input type="text" id="templateAddInput" placeholder="テンプレートに追加" autocomplete="off" />
        <button type="submit">+</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
