<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>買い物くん</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>買い物くん</h1>
      <span class="sync-status" id="syncStatus">同期中</span>
    </header>
    <p class="lead">家族全員に共有されています。追加やチェックはみんなの画面に反映されます。</p>

    <!-- 1. テンプレートコピー・編集ボタン -->
    <div class="template-actions">
      <button class="ghost-btn" id="copyTemplateBtn">テンプレートをコピー</button>
      <button class="ghost-btn" id="toggleTemplateBtn">テンプレートを編集</button>
    </div>

    <section class="template-panel" id="templatePanel" hidden>
      <div class="template-head">
        <span>よく買うものテンプレート</span>
      </div>
      <p class="hint">ここで編集した内容が、次に「テンプレートをコピーする」を押したときの雛形になります。</p>
      <div class="items" id="templateItems"></div>
      <form class="add-bar small" id="templateAddForm">
        <input type="text" id="templateAddInput" placeholder="テンプレートに項目を追加" autocomplete="off" />
        <button type="submit" aria-label="テンプレートに追加">＋</button>
      </form>
    </section>

    <!-- 2. 買い物リスト -->
    <section class="column">
      <div class="column-head">
        <span>買い物リスト</span>
        <span class="count" id="listCount">0件</span>
      </div>
      <div class="items" id="listItems"></div>
      <p class="empty" id="listEmpty">買うものはありません。下の欄から追加してください。</p>
      <div class="list-actions">
        <button class="clear-btn" id="clearCartBtn" hidden>購入済みを削除</button>
        <button class="clear-btn danger" id="clearAllBtn" hidden>すべて削除</button>
      </div>
    </section>

    <!-- 3. 項目追加入力欄・ボタン -->
    <form class="add-bar" id="addForm">
      <input type="text" id="addInput" placeholder="牛乳、卵、お米..." autocomplete="off" />
      <button type="submit" aria-label="追加">＋</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
